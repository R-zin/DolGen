[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pycodestyle + pyflakes + import sorting + bugbear + pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
